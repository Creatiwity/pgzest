# git-cliff configuration: CHANGELOG.md is generated from the commit
# messages, which follow Conventional Commits since 0.1.0
# (https://www.conventionalcommits.org). See RELEASING.md.
#
#   git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md

[changelog]
header = ""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
  {% if commit.breaking %}[**breaking**] {% endif %}\
  {{ commit.message }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}

"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|build|test|style)", group = "<!-- 5 -->Maintenance" },
  { body = ".*security", group = "<!-- 6 -->Security" },
]
