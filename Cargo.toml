[workspace]
members = [
    "crates/pgzest-ast",
    "crates/pgzest-diagnostics",
    "crates/pgzest-analysis",
    "crates/pgzest-expand",
    "crates/pgzest-parser",
    "crates/pgzest-schema",
    "crates/pgzest-catalog",
    "crates/pgzest-sema",
    "crates/pgzest-plugin",
    "crates/pgzest-lint",
    "crates/pgzest-cli",
    "crates/pgzest-codegen",
    "crates/pgzest-query",
    "crates/pgzest-runtime",
    "crates/pgzest-build",
    "crates/pgzest-macros",
    "examples/rust-service",
    "examples/demo",
    "crates/pgzest-oracle",
    "xtask",
    "bindings/wasm",
    "bindings/node",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Creatiwity/pgzest"
homepage = "https://pgzest.creatiwity.net"
authors = ["Creatiwity <hello@creatiwity.net>"]

[workspace.dependencies]
# Internal crates (same version as [workspace.package]).
pgzest-analysis = { path = "crates/pgzest-analysis", version = "0.2.2" }
pgzest-ast = { path = "crates/pgzest-ast", version = "0.2.2" }
pgzest-build = { path = "crates/pgzest-build", version = "0.2.2" }
pgzest-catalog = { path = "crates/pgzest-catalog", version = "0.2.2" }
pgzest-codegen = { path = "crates/pgzest-codegen", version = "0.2.2" }
pgzest-diagnostics = { path = "crates/pgzest-diagnostics", version = "0.2.2" }
pgzest-expand = { path = "crates/pgzest-expand", version = "0.2.2" }
pgzest-lint = { path = "crates/pgzest-lint", version = "0.2.2" }
pgzest-macros = { path = "crates/pgzest-macros", version = "0.2.2" }
pgzest-oracle = { path = "crates/pgzest-oracle", version = "0.2.2" }
pgzest-parser = { path = "crates/pgzest-parser", version = "0.2.2" }
pgzest-plugin = { path = "crates/pgzest-plugin", version = "0.2.2" }
pgzest-query = { path = "crates/pgzest-query", version = "0.2.2" }
pgzest-runtime = { path = "crates/pgzest-runtime", version = "0.2.2" }
pgzest-schema = { path = "crates/pgzest-schema", version = "0.2.2" }
pgzest-sema = { path = "crates/pgzest-sema", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
sqlparser = "=0.63.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
napi-build = "2"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.18"
insta = "1.49.0"
wasmi = "2"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["clock"], default-features = false }
