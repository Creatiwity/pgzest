[workspace]
members = [
    "crates/pgsql-ast",
    "crates/pgsql-parser",
    "crates/pgsql-checker",
    "crates/pgsql-semantic",
    "crates/pgsql-plugin",
    "crates/pgsql-lint",
    "crates/pgsql-cli",
    "crates/pgsql-codegen",
    "crates/pgsql-lsp",
    "crates/pgsql-plugin-wasm",
    "bindings/wasm",
    "bindings/node",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
sqlparser = "0.62"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
napi = { version = "3", features = ["napi6"] }
napi-derive = "3"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
wasmi = "1"
clap = { version = "4", features = ["derive"] }
