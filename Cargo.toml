[workspace]
members = [
    "crates/pgzest-ast",
    "crates/pgzest-diagnostics",
    "crates/pgzest-analysis",
    "crates/pgzest-macro",
    "crates/pgzest-parser",
    "crates/pgzest-checker",
    "crates/pgzest-schema",
    "crates/pgzest-catalog",
    "crates/pgzest-project",
    "crates/pgzest-sema",
    "crates/pgzest-plugin",
    "crates/pgzest-lint",
    "crates/pgzest-cli",
    "crates/pgzest-codegen",
    "crates/pgzest-lsp",
    "crates/pgzest-plugin-wasm",
    "crates/pgzest-query",
    "crates/pgzest-runtime",
    "crates/pgzest-build",
    "crates/pgzest-macros",
    "examples/rust-service",
    "examples/demo",
    "crates/pgzest-oracle",
    "xtask",
    "bindings/wasm",
    "bindings/node",
]
resolver = "2"

[workspace.dependencies]
pgzest-diagnostics = { path = "crates/pgzest-diagnostics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
sqlparser = "=0.62.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
napi-build = "2"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.18"
insta = "1.49.0"
wasmi = "2"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["clock"], default-features = false }
