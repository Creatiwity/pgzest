[workspace]
members = [
    "crates/pgweave-ast",
    "crates/pgweave-diagnostics",
    "crates/pgweave-analysis",
    "crates/pgweave-macro",
    "crates/pgweave-parser",
    "crates/pgweave-checker",
    "crates/pgweave-schema",
    "crates/pgweave-catalog",
    "crates/pgweave-project",
    "crates/pgweave-sema",
    "crates/pgweave-plugin",
    "crates/pgweave-lint",
    "crates/pgweave-cli",
    "crates/pgweave-codegen",
    "crates/pgweave-lsp",
    "crates/pgweave-plugin-wasm",
    "crates/pgweave-query",
    "crates/pgweave-runtime",
    "crates/pgweave-build",
    "crates/pgweave-macros",
    "examples/rust-service",
    "examples/demo",
    "crates/pgweave-oracle",
    "xtask",
    "bindings/wasm",
    "bindings/node",
]
resolver = "2"

[workspace.dependencies]
pgweave-diagnostics = { path = "crates/pgweave-diagnostics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
sqlparser = "=0.62.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
napi-build = "2"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.18"
insta = "1.49.0"
wasmi = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"], default-features = false }
