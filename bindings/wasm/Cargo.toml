[package]
name = "pgweave-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pgweave-parser = { path = "../../crates/pgweave-parser" }
pgweave-checker = { path = "../../crates/pgweave-checker" }
pgweave-diagnostics = { workspace = true }
pgweave-schema = { path = "../../crates/pgweave-schema" }
pgweave-lint = { path = "../../crates/pgweave-lint" }
pgweave-codegen = { path = "../../crates/pgweave-codegen" }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
