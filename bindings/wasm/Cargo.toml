[package]
name = "pgzest-wasm"
version = "0.1.0"
edition = "2024"
# Frozen until P8 (PLAN.md): not published.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pgzest-catalog = { path = "../../crates/pgzest-catalog" }
pgzest-parser = { path = "../../crates/pgzest-parser" }
pgzest-analysis = { path = "../../crates/pgzest-analysis" }
pgzest-diagnostics = { workspace = true }
pgzest-schema = { path = "../../crates/pgzest-schema" }
pgzest-lint = { path = "../../crates/pgzest-lint" }
pgzest-codegen = { path = "../../crates/pgzest-codegen" }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
