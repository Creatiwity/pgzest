name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml drives the installed version.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Differential oracle (PLAN.md §7): the crates/pgweave-oracle/cases corpus
  # is prepared on a real PostgreSQL 18 and compared with pgweave's analysis.
  # The expected report is the tests/snapshots/oracle__report.snap snapshot:
  # any difference, improvements included, fails the job until reviewed
  # (`make oracle-accept` locally).
  oracle:
    name: Oracle PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pgweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGWEAVE_ORACLE_URL: postgres://postgres:pgweave@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Oracle
        run: cargo test -p pgweave-oracle --test oracle -- --ignored

      - name: Overload resolution (sweep)
        run: cargo test -p pgweave-sema --test oracle_sweep -- --ignored

      - name: Operator precedence
        run: cargo test -p pgweave-oracle --test precedence -- --ignored

      - name: Migrations (generated, applied)
        run: cargo test -p pgweave-oracle --test migrations -- --ignored

      - name: Isolated temp tables and snapshots
        run: cargo test -p pgweave-oracle --test instrument -- --ignored

      - name: Example Rust service (generated queries, executed)
        run: cargo test -p pgweave-example-rust-service -- --ignored

  typescript:
    name: TypeScript (npm package + extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install (npm package)
        run: npm install --no-fund --no-audit
        working-directory: npm/pgweave

      - name: Typecheck (npm package)
        run: npx tsc --noEmit
        working-directory: npm/pgweave

      - name: Build (npm package)
        run: npx tsc
        working-directory: npm/pgweave

      - name: Test (npm package)
        run: node --test "dist/**/*.test.js"
        working-directory: npm/pgweave

      - name: Install (VS Code extension)
        run: npm install --no-fund --no-audit
        working-directory: editors/vscode

      - name: Build (VS Code extension)
        run: npx tsc -p ./
        working-directory: editors/vscode

  wasm:
    name: WASM bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target bundler --out-dir pkg
        working-directory: bindings/wasm

  demo:
    name: Smoke CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p pgweave

      # examples/test.sql references a table missing from the schema: exit
      # code 1 is expected. This locks the "check exits 1 on error" contract.
      - name: check detects the expected error
        run: |
          if ./target/debug/pgweave check examples/test.sql; then
            echo "::error::pgweave check should have failed on examples/test.sql"
            exit 1
          fi

      - name: lint runs without crashing
        run: ./target/debug/pgweave lint examples/schema.sql

      - name: codegen produces a TS interface
        run: |
          out=$(./target/debug/pgweave codegen --input examples/schema.sql)
          echo "$out"
          echo "$out" | grep -q "export interface" \
            || { echo "::error::codegen produced no interface"; exit 1; }
