name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml drives the installed version.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Test (runtime tracing feature)
        run: cargo test -p pgzest-runtime --features opentelemetry

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (runtime tracing feature)
        run: cargo clippy -p pgzest-runtime --all-targets --features opentelemetry -- -D warnings

      # The site's CLI and diagnostics references are generated from the
      # code; a diagnostic code written as a literal escapes them.
      - name: Generated documentation up to date
        run: cargo run -p xtask -- docs --check

  # Differential oracle (PLAN.md §7): the crates/pgzest-oracle/cases corpus
  # is prepared on a real PostgreSQL 18 and compared with pgzest's analysis.
  # The expected report is the tests/snapshots/oracle__report.snap snapshot:
  # any difference, improvements included, fails the job until reviewed
  # (`make oracle-accept` locally).
  oracle:
    name: Oracle PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pgzest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGZEST_ORACLE_URL: postgres://postgres:pgzest@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Oracle
        run: cargo test -p pgzest-oracle --test oracle -- --ignored

      - name: Overload resolution (sweep)
        run: cargo test -p pgzest-sema --test oracle_sweep -- --ignored

      - name: Operator precedence
        run: cargo test -p pgzest-oracle --test precedence -- --ignored

      - name: Migrations (generated, applied)
        run: cargo test -p pgzest-oracle --test migrations -- --ignored

      - name: Isolated temp tables, snapshots, run logs and run trees
        run: cargo test -p pgzest-oracle --test instrument -- --ignored

      - name: Run traces (notices to OpenTelemetry spans)
        run: cargo test -p pgzest-runtime --features opentelemetry --test trace -- --ignored

      - name: pgzest dev (routines applied on save)
        run: cargo test -p pgzest --test dev -- --ignored

      - name: pgzest db check (hand changes found)
        run: cargo test -p pgzest --test db_check -- --ignored

      - name: Example Rust service (generated queries, executed)
        run: cargo test -p pgzest-example-rust-service -- --ignored

  # What `cargo publish` would upload, built from the packaged sources
  # alone: a file outside a crate or a missing version fails here, not
  # on release day.
  package:
    name: Crates package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Package and verify
        run: cargo publish --workspace --dry-run --locked

  # The npm package (npm/pgzest) is frozen until P8, which rebuilds it on
  # top of the query descriptor (PLAN.md): it is not checked here.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --no-fund --no-audit
        working-directory: editors/vscode

      - name: Typecheck and bundle
        run: npm run compile
        working-directory: editors/vscode

      - name: Package
        run: npx vsce package --out pgzest.vsix
        working-directory: editors/vscode

  site:
    name: Documentation site (build + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --no-fund --no-audit
        working-directory: site

      # Fails on a broken internal link (starlight-links-validator).
      - name: Build
        run: npm run build
        working-directory: site

  wasm:
    name: WASM bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target bundler --out-dir pkg
        working-directory: bindings/wasm

  demo:
    name: Smoke CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p pgzest

      # examples/test.sql references a table missing from the schema: exit
      # code 1 is expected. This locks the "check exits 1 on error" contract.
      - name: check detects the expected error
        run: |
          if ./target/debug/pgzest check examples/test.sql; then
            echo "::error::pgzest check should have failed on examples/test.sql"
            exit 1
          fi

      - name: lint runs without crashing
        run: ./target/debug/pgzest lint examples/schema.sql
