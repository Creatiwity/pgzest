name: Site

# Publishes the documentation site to GitHub Pages
# (https://pgzest.creatiwity.net, custom domain set in Settings → Pages). Never on a plain push: by hand
# (Actions → Site → Run workflow) or with a release tag, so the site
# describes what is released. Requires Settings → Pages → Source: GitHub
# Actions.

on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci --no-fund --no-audit
        working-directory: site

      # Fails on a broken internal link (starlight-links-validator).
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
