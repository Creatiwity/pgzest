<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">pgzest — raw PostgreSQL with zest: checked as PostgreSQL would, turned into typed Rust</title>
  <desc id="desc">A named SQL query of the demo, restaurant_by_slug, whose columns drip into the fields of the Rust struct pgzest generates from it; the nullable opened_on column becomes Option&lt;Date&gt;.</desc>

  <defs>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <!-- A drop of juice, centered on its round end. -->
    <path id="drop" d="M0 -11 C 4 -5, 6 -1, 6 2 A 6 6 0 0 1 -6 2 C -6 -1, -4 -5, 0 -11 Z"/>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#17140F"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#9A8E78">POSTGRESQL TOOLCHAIN · RUST</text>
    <!-- The mark: a citrus slice, its rind (the zest), pith and segments. -->
    <g transform="translate(52 102) scale(1.15)">
      <circle cx="32" cy="32" r="24" fill="#FF9F1C"/>
      <circle cx="32" cy="32" r="20.5" fill="#FFF1C9"/>
      <circle cx="32" cy="32" r="18.5" fill="#FFD43B"/>
      <g stroke="#FFF1C9" stroke-width="2.4" stroke-linecap="round">
        <path d="M32 32 V13.5 M32 32 V50.5 M32 32 H13.5 M32 32 H50.5"/>
        <path d="M32 32 L18.9 18.9 M32 32 L45.1 45.1 M32 32 L45.1 18.9 M32 32 L18.9 45.1"/>
      </g>
      <circle cx="32" cy="32" r="3" fill="#FFF1C9"/>
    </g>
    <text x="140" y="168" font-size="84" font-weight="700" fill="#F6EFE3">pgzest</text>
    <text x="56" y="236" font-size="27" fill="#D6CBB8">Raw PostgreSQL, with <tspan fill="#FF9F1C" font-weight="600">zest</tspan>:</text>
    <text x="56" y="272" font-size="27" fill="#D6CBB8">checked the way PostgreSQL would,</text>
    <text x="56" y="308" font-size="27" fill="#D6CBB8">then turned into <tspan fill="#FFD43B">typed code</tspan>,</text>
    <text x="56" y="344" font-size="27" fill="#D6CBB8">migrations and observable routines.</text>
  </g>

  <g id="project-proof" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
    <!-- Each column, dripping into the field it becomes (drawn first: the
         cards cover the ends). -->
    <g fill="none" stroke="url(#juice)" stroke-width="3" stroke-linecap="round">
      <path d="M 744 172 C 744 206, 817 198, 817 232"/>
      <path d="M 805 172 C 805 206, 937 198, 937 232"/>
      <path d="M 907 172 C 907 206, 726 198, 726 232"/>
      <path d="M 1045 172 C 1045 206, 732 198, 732 232"/>
    </g>
    <use href="#drop" transform="translate(664 208)" fill="#FFD43B"/>
    <use href="#drop" transform="translate(1088 200)" fill="#FF9F1C"/>
    <use href="#drop" transform="translate(1114 220) scale(0.6)" fill="#FFD43B"/>

    <!-- The query, as written in queries/restaurants.sql. -->
    <rect x="624" y="40" width="520" height="132" rx="14" fill="#221D15" stroke="#3A3122" stroke-width="1.5"/>
    <text x="648" y="80" fill="#9A8E78">-- name: restaurant_by_slug</text>
    <text x="648" y="116" fill="#F6EFE3"><tspan fill="#FFD43B">SELECT</tspan> id, name, opened_on, created_at</text>
    <text x="648" y="152" fill="#F6EFE3"><tspan fill="#FFD43B">FROM</tspan> restaurants <tspan fill="#FFD43B">WHERE</tspan> slug = $slug</text>
    <g stroke="#FFD43B" stroke-width="2.5" stroke-linecap="round">
      <line x1="732" y1="124" x2="756" y2="124"/>
      <line x1="780" y1="124" x2="829" y2="124"/>
      <line x1="853" y1="124" x2="961" y2="124"/>
      <line x1="985" y1="124" x2="1106" y2="124"/>
    </g>

    <!-- The row struct pgzest generates from it. -->
    <rect x="624" y="232" width="520" height="148" rx="14" fill="#221D15" stroke="#4A3418" stroke-width="1.5"/>
    <text x="648" y="268" fill="#F6EFE3"><tspan fill="#9A8E78">struct Row {</tspan> id: i64, name: String,</text>
    <text x="672" y="306" fill="#F6EFE3">opened_on: <tspan fill="#FF9F1C">Option&lt;Date&gt;</tspan>,</text>
    <text x="672" y="344" fill="#F6EFE3">created_at: OffsetDateTime <tspan fill="#9A8E78">}</tspan></text>
    <g stroke="#FF9F1C" stroke-width="2.5" stroke-linecap="round">
      <line x1="805" y1="276" x2="829" y2="276"/>
      <line x1="913" y1="276" x2="961" y2="276"/>
      <line x1="672" y1="314" x2="780" y2="314"/>
      <line x1="672" y1="352" x2="792" y2="352"/>
    </g>
    <text x="1120" y="372" font-size="16" text-anchor="end" fill="#9A8E78">nullable → Option · unique → Option&lt;Row&gt;</text>
  </g>
</svg>
