<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">How pgzest works</title>
  <desc id="desc">The schema, migrations and queries of a project are replayed into a model of the PostgreSQL 18 catalog, without a database; every query is typed as PostgreSQL would, checked against a real PostgreSQL by an oracle; the result feeds the Rust code, the migrations, the editor and the routine traces.</desc>

  <defs>
    <linearGradient id="juice" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="620" y2="0">
      <stop offset="0" stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="24" fill="#17140F"/>

  <!-- Links first: the boxes cover their ends. -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <g stroke="#FFD43B">
      <path d="M 260 96 C 300 96, 300 190, 340 190"/>
      <path d="M 260 190 L 340 190"/>
      <path d="M 260 284 C 300 284, 300 190, 340 190"/>
    </g>
    <path d="M 560 190 L 620 190" stroke="url(#juice)"/>
    <g stroke="#FF9F1C">
      <path d="M 884 190 C 912 190, 912 78, 940 78"/>
      <path d="M 884 190 C 912 190, 912 152, 940 152"/>
      <path d="M 884 190 C 912 190, 912 226, 940 226"/>
      <path d="M 884 190 C 912 190, 912 300, 940 300"/>
    </g>
  </g>

  <!-- Inputs: the project's files, raw. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#F6EFE3">
    <rect x="56" y="70" width="204" height="52" rx="12" fill="#221D15" stroke="#3A3122" stroke-width="1.5"/>
    <text x="78" y="103">schema/*.sql</text>
    <rect x="56" y="164" width="204" height="52" rx="12" fill="#221D15" stroke="#3A3122" stroke-width="1.5"/>
    <text x="78" y="197">migrations/</text>
    <rect x="56" y="258" width="204" height="52" rx="12" fill="#221D15" stroke="#3A3122" stroke-width="1.5"/>
    <text x="78" y="291">queries/*.sql</text>
  </g>

  <!-- The two stages. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="340" y="132" width="220" height="116" rx="14" fill="#221D15" stroke="#FFD43B" stroke-width="1.5"/>
    <text x="450" y="178" font-size="24" font-weight="700" text-anchor="middle" fill="#F6EFE3">catalog</text>
    <text x="450" y="208" font-size="19" text-anchor="middle" fill="#D6CBB8">replayed, no database</text>
    <text x="450" y="232" font-size="18" text-anchor="middle" fill="#9A8E78">PostgreSQL 18 model</text>

    <rect x="620" y="132" width="264" height="116" rx="14" fill="#221D15" stroke="#FF9F1C" stroke-width="1.5"/>
    <text x="752" y="178" font-size="24" font-weight="700" text-anchor="middle" fill="#F6EFE3">analysis</text>
    <text x="752" y="208" font-size="19" text-anchor="middle" fill="#D6CBB8">typed as PostgreSQL would</text>
    <text x="752" y="232" font-size="18" text-anchor="middle" fill="#9A8E78">oracle: 749/751 columns</text>
  </g>

  <!-- What reads the result. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#F6EFE3">
    <rect x="940" y="52" width="204" height="52" rx="12" fill="#221D15" stroke="#4A3418" stroke-width="1.5"/>
    <text x="962" y="85">typed Rust</text>
    <rect x="940" y="126" width="204" height="52" rx="12" fill="#221D15" stroke="#4A3418" stroke-width="1.5"/>
    <text x="962" y="159">migrations</text>
    <rect x="940" y="200" width="204" height="52" rx="12" fill="#221D15" stroke="#4A3418" stroke-width="1.5"/>
    <text x="962" y="233">editor</text>
    <rect x="940" y="274" width="204" height="52" rx="12" fill="#221D15" stroke="#4A3418" stroke-width="1.5"/>
    <text x="962" y="307">routine traces</text>
  </g>
</svg>
