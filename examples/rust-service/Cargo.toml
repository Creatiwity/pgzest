[package]
name = "pgzest-example-rust-service"
version = "0.1.0"
edition = "2024"
publish = false
description = "End-to-end example: named queries compiled by pgzest-build, run by pgzest-runtime"

[dependencies]
pgzest-macros = { path = "../../crates/pgzest-macros" }
pgzest-runtime = { path = "../../crates/pgzest-runtime" }
tokio-postgres = { workspace = true, features = ["with-time-0_3", "with-uuid-1"] }
time = "0.3"
uuid = "1"

[build-dependencies]
pgzest-build = { path = "../../crates/pgzest-build" }

[dev-dependencies]
pgzest-build = { path = "../../crates/pgzest-build" }
pgzest-expand = { path = "../../crates/pgzest-expand" }
pgzest-runtime = { path = "../../crates/pgzest-runtime" }
tokio = { workspace = true }
