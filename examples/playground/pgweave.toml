# Projet de démonstration pour pgweave. Format : docs/config.md.
# Ouvert automatiquement par F5 depuis editors/vscode/.

[postgres]
version = 18

[schema]
# Parcouru récursivement : schema/tables/ et schema/functions/ sont inclus.
directory = "schema"

[migrations]
directory = "migrations"

[parse]
# Un statement illisible remonte en warning : visible, sans casser le build.
# Passe à "error" pour durcir, "ignore" le temps d'une migration.
unparsable = "warn"
unsupported = "ignore"

[rules]
# Surcharge de sévérité par code de diagnostic. Décommente pour voir l'effet.
# "L001" = "off"        # SELECT *
# "L005" = "error"      # index manquant sur FK
