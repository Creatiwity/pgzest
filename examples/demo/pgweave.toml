# Démo pgweave : un schéma déclaratif (l'état cible), des migrations
# générées depuis lui, des requêtes nommées compilées en Rust (README.md).

[postgres]
version = 18

[migrations]
directory = "migrations"

[schema]
directory = "schema"
declarative = true

[queries]
directory = "queries"

# Enums PostgreSQL générés une fois, dans `crate::db` (src/lib.rs) : les
# requêtes en fichiers et les requêtes `sql!` y renvoient.
[rust]
types = "crate::db"
