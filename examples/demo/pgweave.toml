# pgweave demo: a declarative schema (the target state), migrations
# generated from it, named queries compiled into Rust (README.md).

[postgres]
version = 18

[migrations]
directory = "migrations"

[schema]
directory = "schema"
declarative = true

[queries]
directory = "queries"

# PostgreSQL enums generated once, in `crate::db` (src/lib.rs): file
# queries and `sql!` queries refer to them.
[rust]
types = "crate::db"
