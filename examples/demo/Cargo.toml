[package]
name = "pgzest-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "pgzest demo: named SQL queries compiled into typed Rust, run against PostgreSQL"

[dependencies]
pgzest-runtime = { path = "../../crates/pgzest-runtime", features = ["trace"] }
pgzest-macros = { path = "../../crates/pgzest-macros" }
tokio = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-time-0_3", "with-uuid-1"] }
time = "0.3"
uuid = "1"
