[package]
name = "pgzest-oracle"
description = "pgzest internals: differential oracle against a real PostgreSQL, live schema introspection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
pgzest-catalog = { workspace = true }
pgzest-ast = { workspace = true }
pgzest-parser = { workspace = true }
pgzest-query = { workspace = true }
pgzest-schema = { workspace = true }
pgzest-sema = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
# TLS to the database, read as libpq does (`sslmode`, `sslrootcert`): ring
# rather than aws-lc-rs, which needs a C toolchain on every release target.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }

[dev-dependencies]
insta = { workspace = true }
pgzest-diagnostics = { path = "../pgzest-diagnostics" }
pgzest-expand = { path = "../pgzest-expand" }
serde_json = { workspace = true }
