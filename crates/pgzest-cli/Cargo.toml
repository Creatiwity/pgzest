[package]
name = "pgzest"
description = "Raw PostgreSQL, with zest: SQL checked the way PostgreSQL would, without a database. CLI and language server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["postgresql", "sql", "plpgsql", "lsp", "type-checker"]
categories = ["command-line-utilities", "database", "development-tools"]

[[bin]]
name = "pgzest"
path = "src/main.rs"

[dependencies]
pgzest-catalog = { workspace = true }
pgzest-sema = { workspace = true }
pgzest-analysis = { workspace = true }
pgzest-ast = { workspace = true }
pgzest-expand = { workspace = true }
pgzest-diagnostics = { workspace = true }
pgzest-schema = { workspace = true }
pgzest-parser = { workspace = true }
pgzest-query = { workspace = true }
pgzest-codegen = { workspace = true }
pgzest-lint = { workspace = true }
pgzest-plugin = { workspace = true }
pgzest-oracle = { workspace = true }
similar = "3"

serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tower-lsp = { workspace = true }
