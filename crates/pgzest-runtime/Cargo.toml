[package]
name = "pgzest-runtime"
description = "Runs pgzest-generated PostgreSQL queries on tokio-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["postgresql", "sql", "tokio-postgres", "database"]
categories = ["database", "asynchronous"]

[dependencies]
tokio-postgres = { workspace = true }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { workspace = true }
# `trace`: runs of the logged routines (notices), as trees of runs.
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }

[features]
trace = ["dep:serde_json", "dep:chrono"]
opentelemetry = ["trace", "dep:opentelemetry"]
# `migrate`: applies migrations, with their registry (`pgzest migrate apply`).
migrate = []

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
pgzest-expand = { path = "../pgzest-expand" }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
