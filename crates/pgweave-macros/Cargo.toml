[package]
name = "pgweave-macros"
version = "0.1.0"
edition = "2024"
description = "`query!` macro: inline SQL query analyzed at compile time (PLAN.md §5, P5)"

[lib]
proc-macro = true

[dependencies]
pgweave-diagnostics = { workspace = true }
pgweave-build = { path = "../pgweave-build" }
pgweave-codegen = { path = "../pgweave-codegen" }
pgweave-query = { path = "../pgweave-query" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
