[package]
name = "pgweave-catalog"
version = "0.1.0"
edition = "2024"
description = "Catalogue PostgreSQL de pgweave : modèle, packs générés, application des DDL"

[dependencies]
pgweave-ast = { path = "../pgweave-ast" }
pgweave-diagnostics = { workspace = true }
# Pont transitoire vers `SchemaProvider` (module `compat`), retiré en fin de P2.
pgweave-schema = { path = "../pgweave-schema" }
pgweave-macro = { path = "../pgweave-macro" }
pgweave-parser = { path = "../pgweave-parser" }
serde = { workspace = true }
serde_json = { workspace = true }

