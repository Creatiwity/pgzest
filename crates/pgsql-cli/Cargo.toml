[package]
name = "pgsql"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pgsql"
path = "src/main.rs"

[dependencies]
pgsql-ast = { path = "../pgsql-ast" }
pgsql-diagnostics = { workspace = true }
pgsql-schema = { path = "../pgsql-schema" }
pgsql-parser = { path = "../pgsql-parser" }
pgsql-checker = { path = "../pgsql-checker" }
pgsql-codegen = { path = "../pgsql-codegen" }
pgsql-lint = { path = "../pgsql-lint" }
pgsql-plugin = { path = "../pgsql-plugin" }
pgsql-plugin-wasm = { path = "../pgsql-plugin-wasm" }
pgsql-semantic = { path = "../pgsql-semantic" }
serde = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
