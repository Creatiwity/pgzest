[package]
name = "pgzest-macros"
description = "query! and queries!: PostgreSQL queries typed at compile time, without a database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["postgresql", "sql", "macros", "typed", "compile-time"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
pgzest-diagnostics = { workspace = true }
pgzest-build = { workspace = true }
pgzest-codegen = { workspace = true }
pgzest-query = { workspace = true }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
