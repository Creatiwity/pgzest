[package]
name = "pgzest-build"
description = "Typed Rust from named PostgreSQL queries, generated in build.rs, checked without a database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["postgresql", "sql", "codegen", "typed", "build"]
categories = ["database", "development-tools::build-utils"]

[dependencies]
pgzest-catalog = { workspace = true }
pgzest-codegen = { workspace = true }
pgzest-diagnostics = { workspace = true }
pgzest-expand = { workspace = true }
pgzest-query = { workspace = true }
pgzest-schema = { workspace = true }
pgzest-sema = { workspace = true }
